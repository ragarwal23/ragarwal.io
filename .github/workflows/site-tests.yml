name: Site tests

on:
  push:
    branches: [main, eilla_based_redesign]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline checks
        run: python3 tests/site_check.py
      - name: Online checks (raw + live site if reachable)
        run: python3 tests/site_check.py --online
